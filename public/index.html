<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Agent Room</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
:root{
  --bg:#FAF9F5; --side:#F3F1EA; --surface:#FFFFFF; --raised:#F0EEE6; --line:#E6E2D8; --line2:#D9D4C7;
  --text:#2B2A27; --text2:#6B6860; --text3:#9A968C; --accent:#C96442; --accent-soft:#F4E4DC;
  --user:#EFEDE5; --ok:#3F8F5E; --err:#C2483A; --code:#F3F1EA; --shadow:0 1px 2px rgba(40,30,10,.04),0 6px 24px rgba(40,30,10,.06);
  --serif:"Noto Serif KR","Tiempos Headline",Georgia,serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --side:#1F1E1D; --surface:#30302E; --raised:#383835; --line:#3A3936; --line2:#4A4844;
  --text:#ECEAE3; --text2:#B1ADA3; --text3:#85827A; --accent:#D97757; --accent-soft:#45302A;
  --user:#141413; --code:#1C1B1A; --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1F1E1D; --surface:#30302E; --raised:#383835; --line:#3A3936; --line2:#4A4844;
  --text:#ECEAE3; --text2:#B1ADA3; --text3:#85827A; --accent:#D97757; --accent-soft:#45302A;
  --user:#141413; --code:#1C1B1A; --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.app{display:flex;position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100dvh)}
html,body{overscroll-behavior:none}

/* ---- sidebar ---- */
.side{width:280px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
.newbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:550;color:var(--text)}
.newbtn:hover{background:var(--raised)}
.newbtn .plus{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.side h6{margin:18px 10px 6px;font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.02em}
.rooms{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px}
.room-item{width:100%;text-align:left;display:block;padding:8px 10px;border-radius:9px;margin-bottom:1px;position:relative}
.room-item:hover{background:var(--raised)}
.room-item.active{background:var(--raised)}
.room-item .t{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.room-item .p{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.side-foot{display:flex;gap:6px;padding:8px 4px 2px;border-top:1px solid var(--line);margin-top:8px;align-items:center}
.agent-dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.agent-dot{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.agent-dot i{width:7px;height:7px;border-radius:50%}
.agent-dot.off{opacity:.45;text-decoration:line-through}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text2);flex:none}
.iconbtn:hover{background:var(--raised);color:var(--text)}

/* ---- main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .menu{display:none}
.top .title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:4px 8px;border-radius:8px}
.top .title:hover{background:var(--raised)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--text2);white-space:nowrap;max-width:260px;background:var(--surface)}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip svg{flex:none}
.chip:hover{border-color:var(--line2);color:var(--text)}
.spacer{flex:1}
.writer{display:flex;align-items:center;background:var(--raised);border-radius:999px;padding:3px;gap:2px}
.writer .lbl{font-size:12px;color:var(--text3);padding:0 6px 0 8px;white-space:nowrap}
.writer button{height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.writer button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.writer button i{width:7px;height:7px;border-radius:50%}

.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.thread{max-width:780px;margin:0 auto;padding:18px 22px 40px}
.msg{margin:22px 0;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--user);padding:10px 15px;border-radius:18px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.atts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.att{font-size:12.5px;padding:5px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--text2);display:flex;gap:6px;align-items:center;max-width:220px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.system{display:flex;justify-content:center}
.msg.system div{font-size:12.5px;color:var(--text3);background:transparent;border:1px dashed var(--line2);padding:4px 12px;border-radius:999px}
.who{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;font-family:var(--serif)}
.who .n{font-weight:650;font-size:14px}
.who .tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.who .time{font-size:12px;color:var(--text3)}
.body{padding-left:35px;word-break:break-word}
.md p{margin:0 0 .7em}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-family:var(--serif);font-weight:600;line-height:1.35;margin:1em 0 .4em;letter-spacing:-.01em}
.md h1{font-size:1.3em}.md h2{font-size:1.15em}.md h3{font-size:1.04em}
.md ul,.md ol{margin:.2em 0 .8em;padding-left:1.4em}.md li{margin:.15em 0}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:.12em .4em;border-radius:5px;border:1px solid var(--line)}
.md pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5;margin:.6em 0}
.md pre code{background:none;border:0;padding:0;font-size:inherit}
.md a{color:var(--accent)}
.md blockquote{margin:.5em 0;padding-left:12px;border-left:3px solid var(--line2);color:var(--text2)}
.md .mention{color:var(--accent);font-weight:600}
.md table{border-collapse:collapse;margin:.6em 0;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 10px}

.steps{margin:2px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.steps summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none}
.steps summary::-webkit-details-marker{display:none}
.steps summary .chev{transition:transform .2s;margin-left:auto;color:var(--text3)}
.steps[open] summary .chev{transform:rotate(90deg)}
.steps .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.steps ol{list-style:none;margin:0;padding:4px 0 6px;border-top:1px solid var(--line);max-height:320px;overflow-y:auto}
.step{display:flex;gap:9px;padding:4px 12px;font-size:12.5px;color:var(--text2);align-items:flex-start}
.step .ic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--text3)}
.step .tx{flex:1;min-width:0;font-family:var(--mono);font-size:12px;word-break:break-all}
.step.error .tx{color:var(--err)}
.step pre{margin:4px 0 2px;font-size:11.5px;max-height:140px;overflow:auto;background:var(--code);padding:6px 8px;border-radius:8px;white-space:pre-wrap;color:var(--text3)}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.typing{display:flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.thinking{font-size:13px;color:var(--text3);font-style:italic;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.changes{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
.changes .sum{color:var(--text2)}
.add{color:var(--ok);font-family:var(--mono);font-size:12px}.del{color:var(--err);font-family:var(--mono);font-size:12px}
.linkbtn{color:var(--accent);font-weight:600;font-size:13px;padding:2px 4px;border-radius:6px}
.linkbtn:hover{background:var(--accent-soft)}
.linkbtn.muted{color:var(--text2)}
.st-err{color:var(--err)}.st-stop{color:var(--text3);font-size:12.5px;margin-top:4px}

/* empty */
.empty{max-width:640px;margin:0 auto;padding:12vh 24px 24px;text-align:center}
.empty .faces{display:flex;justify-content:center;gap:-6px;margin-bottom:22px}
.empty .faces .av{width:44px;height:44px;border-radius:14px;font-size:20px;border:3px solid var(--bg);margin:0 -4px}
.empty h1{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.02em;margin:0 0 10px;line-height:1.3}
.empty p{color:var(--text2);margin:0 auto;max-width:440px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:28px;text-align:left}
.tip{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--text2);background:var(--surface)}
.tip b{display:block;color:var(--text);font-weight:600;margin-bottom:3px;font-size:14px}

/* composer */
.composer-wrap{flex:none;padding:0 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.composer{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 8px 14px;position:relative}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2))}
.quick{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.quick button{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--raised);color:var(--text2);display:flex;align-items:center;gap:5px}
.quick button:hover{color:var(--text)}
.quick button i{width:7px;height:7px;border-radius:50%}
textarea.inp{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.5;max-height:40vh;min-height:26px;padding:2px 0;display:block}
textarea.inp::placeholder{color:var(--text3)}
.crow{display:flex;align-items:center;gap:6px;margin-top:6px}
.pending{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pending .att button{color:var(--text3);margin-left:2px}
.send{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;transition:opacity .15s,transform .1s}
.send:disabled{opacity:.35;cursor:default}
.send:active{transform:scale(.95)}
.stop{height:34px;padding:0 12px 0 10px;border-radius:12px;background:var(--text);color:var(--bg);display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.busyline{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:7px;min-width:0}
.busyline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mentions{position:absolute;bottom:calc(100% + 6px);left:10px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:5px;min-width:200px;display:none;z-index:5}
.mentions.show{display:block}
.mentions button{display:flex;width:100%;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;font-size:14px;text-align:left}
.mentions button.sel,.mentions button:hover{background:var(--raised)}
.mentions .av{width:22px;height:22px;font-size:11px;border-radius:6px}
.mentions small{color:var(--text3);margin-left:auto;font-size:12px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.35);display:none;z-index:20;animation:fade .15s}
.scrim.show{display:block}
@keyframes fade{from{opacity:0}}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:min(640px,calc(100dvh - 40px));background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:21;display:none;flex-direction:column;overflow:hidden}
.modal.show{display:flex;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
.modal header{padding:18px 20px 8px;display:flex;align-items:center;gap:8px}
.modal header h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;flex:1}
.modal .mbody{padding:6px 20px 12px;overflow-y:auto}
.modal footer{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:550}
.field input,.field select{width:100%;height:42px;border:1px solid var(--line2);border-radius:11px;background:var(--bg);padding:0 12px;outline:0}
.field input:focus{border-color:var(--accent)}
.btn{height:38px;padding:0 16px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err)}
.fs{border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.fs .crumb{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--raised);font-size:12.5px;font-family:var(--mono);color:var(--text2);word-break:break-all}
.fs ul{list-style:none;margin:0;padding:4px;max-height:260px;overflow-y:auto}
.fs li button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:14px}
.fs li button:hover{background:var(--raised)}
.fs .none{padding:14px;color:var(--text3);font-size:13px;text-align:center}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease,visibility .25s;visibility:hidden}
.drawer.show{transform:none;visibility:visible;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:0;flex:1}
.files{padding:8px 10px;border-bottom:1px solid var(--line);max-height:30vh;overflow-y:auto}
.file{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;font-family:var(--mono)}
.file:hover{background:var(--raised)}
.file .s{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none;font-family:var(--sans)}
.s-A{background:#DCEFE2;color:#2C7A4B}.s-M{background:#F6E8CF;color:#9A6416}.s-D{background:#F5DAD6;color:#A8392C}
.file .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.patch{flex:1;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.55;padding:8px 0}
.patch div{padding:0 14px;white-space:pre;min-height:1.55em}
.patch .a{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--text)}
.patch .d{background:color-mix(in srgb,var(--err) 13%,transparent);color:var(--text)}
.patch .h{color:var(--accent);background:var(--raised);margin-top:8px;padding-top:2px;padding-bottom:2px}
.patch .f{font-weight:700;color:var(--text);padding-top:12px}
.patch .m{color:var(--text3)}
.drawer footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.drawer footer .note{flex:1;font-size:12.5px;color:var(--text3)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.conn{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--err);color:#fff;font-size:12.5px;padding:5px 12px;border-radius:999px;z-index:40;display:none}
.conn.show{display:block}

/* 0.8 */
.msg.manager .who .n{color:var(--text)}
.mgr-av{background:linear-gradient(135deg,#2B2A27,#55524A)}
.mgrbox{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:var(--surface)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal a,.gal div.it{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);text-decoration:none;color:var(--text)}
.gal img{width:100%;height:100px;object-fit:cover;display:block;background:var(--raised)}
.gal .ph{height:100px;display:grid;place-items:center;background:var(--raised);font-size:28px}
.gal .cap{padding:6px 8px;font-size:12px;line-height:1.4}
.gal .cap small{display:block;color:var(--text3)}
.stt{width:100%;border-collapse:collapse;font-size:13.5px}
.stt th,.stt td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.stt th:first-child,.stt td:first-child{text-align:left}
.sidebtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--text2);width:100%;text-align:left}
.sidebtn:hover{background:var(--raised);color:var(--text)}
.sidebtn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:auto}

/* 0.7 */
.mcard{margin:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.mcard.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 4%,var(--surface))}
.mcard .tx{line-height:1.5}

async function api(path, opts={}){
  const res = await fetch(path, { ...opts, headers:{ 'x-token':TOKEN, ...(opts.body && !(opts.body instanceof Blob) && !(opts.body instanceof File) ? {'Content-Type':'application/json'} : {}), ...(opts.headers||{}) } });

// ---------- 마크다운 (안전한 최소 구현) ----------
function md(src){
  const blocks = []; let s = String(src||'');
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => { blocks.push('<pre><button class="cp" data-copycode>복사</button><code>'+esc(code.replace(/\n$/,''))+'</code></pre>'); return '\u0000'+(blocks.length-1)+'\u0000'; });
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, (_, c) => '<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)@([^\s@,.!?:;()<>]+)/g, (all, sp, nm) => aliasPairs().some(([,n]) => nm.toLowerCase().startsWith(String(n).toLowerCase())) ? `${sp}<span class="mention">@${nm}</span>` : all);
  const out = []; const lines = s.split('\n'); let i = 0;
  while (i < lines.length){
    let l = lines[i];
    const ph = l.match(/^\u0000(\d+)\u0000$/);
    if (ph){ out.push(blocks[+ph[1]]); i++; continue; }
    if (/^\s*$/.test(l)){ i++; continue; }
    let h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*[-*•]\s+/.test(l)){ const items=[]; while(i<lines.length && /^\s*[-*•]\s+/.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>'); i++; } out.push('<ul>'+items.join('')+'</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)){ const items=[]; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>'); i++; } out.push('<ol>'+items.join('')+'</ol>'); continue; }
    if (/^\s*>/.test(l)){ const q=[]; while(i<lines.length && /^\s*>/.test(lines[i])){ q.push(inline(lines[i].replace(/^\s*>\s?/,''))); i++; } out.push('<blockquote>'+q.join('<br>')+'</blockquote>'); continue; }
    if (/^\|.*\|\s*$/.test(l) && i+1<lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const row = (r) => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = row(l); i += 2; const body=[];
      while(i<lines.length && /^\|.*\|\s*$/.test(lines[i])){ body.push(row(lines[i])); i++; }
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    const para=[]; while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*>|\u0000\d+\u0000$)/.test(lines[i])){ para.push(inline(lines[i])); i++; }
    if (para.length) out.push('<p>'+para.join('<br>')+'</p>'); else { out.push('<p>'+inline(l)+'</p>'); i++; }
  }
  return out.join('');
}

  const a=agent(id); const sz = size?`;width:${size}px;height:${size}px`:'';

  return `<div class="av" style="background:${a.color}${sz}">${inner}</div>`;
}

// ---------- 다시 왔을 때 브리핑 ----------
function markSeen(){ if (S.current && document.visibilityState === 'visible') store.set('ar_seen_'+S.current, String(Date.now())); }
setInterval(markSeen, 20000);
document.addEventListener('visibilitychange', () => { if (document.hidden) markSeen(); else if (S.current) showBriefing(S.current); });
function showBriefing(id){
  const seen = +store.get('ar_seen_'+id) || 0; markSeen();
  if (!seen || Date.now() - seen < 30*60000) return;
  const fresh = S.messages.filter(m => (m.doneAt || m.ts) > seen && m.role !== 'user');
  const agents = fresh.filter(m => m.role === 'agent' && m.status !== 'running');
  if (!agents.length) return;
  const files = agents.reduce((n,m)=>n+((m.changes||[]).length),0);
  const pending = agents.filter(m => (m.changes||[]).length && !m.review).length;
  const fails = agents.filter(m => m.status === 'error').length;
  const mem = agents.filter(m => m.memoryUpdate).reduce((a,m)=>({add:a.add+m.memoryUpdate.added, rem:a.rem+m.memoryUpdate.removed}),{add:0,rem:0});
  const who = [...new Set(agents.map(m=>agent(m.agent).name))].join(', ');
  const last = agents[agents.length-1];
  const away = Date.now() - seen; const h = Math.floor(away/3600000);
  const lines = [
    `${who}${(()=>{ const c=who.charCodeAt(who.length-1); return c>=0xac00&&c<=0xd7a3&&(c-0xac00)%28 ? '이' : '가'; })()} ${agents.length}번 답했어요${files?` · 파일 ${files}개 변경${pending?`, <b>승인 대기 ${pending}건</b>`:''}`:''}${fails?` · 실패 ${fails}건`:''}`,
    mem.add||mem.rem ? `방 기억이 바뀌었어요 (+${mem.add} −${mem.rem})` : null,
    `마지막: <b style="color:${agent(last.agent).color}">${esc(agent(last.agent).name)}</b> — ${esc((last.errorHint || last.text || '').replace(/\s+/g,' ').slice(0,90))}`,
  ].filter(Boolean).slice(0,3);
  const box = document.createElement('div');
  box.className = 'brief'; box.id = 'brief';
  box.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><b>자리 비운 동안 (${h ? h+'시간' : Math.floor(away/60000)+'분'})</b><span class="spacer"></span>${mem.add||mem.rem?'<button class="linkbtn" id="briefMem">기억 보기</button>':''}<button class="iconbtn" style="width:28px;height:28px" id="briefX">${I.x}</button></div><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
  $('#brief')?.remove();
  const th = $('#thread'); th.parentNode.insertBefore(box, th);
  $('#briefX').onclick = () => box.remove();
  if ($('#briefMem')) $('#briefMem').onclick = () => openPanel('memory');
}

    const st = +el.dataset.start, lo = +el.dataset.last || 0, act = el.dataset.act || '';
    const since = lo ? Date.now() - lo : Date.now() - st;
    el.textContent = `⏱ ${fmtDur(Date.now()-st)} · ${lo ? '마지막 출력 '+fmtDur(since)+' 전' : '출력 기다리는 중'}${act ? ' · '+act : ''}`;

  });
}, 1000);

function fmtLeft(ms){
  const d = ms - Date.now(); if (d <= 0) return '곧 초기화';
  const h = Math.floor(d/3600000), m = Math.floor(d%3600000/60000);
  if (h >= 24) return `${Math.floor(h/24)}일 ${h%24}시간 뒤 초기화`;
  return h ? `${h}시간 ${m}분 뒤 초기화` : `${m}분 뒤 초기화`;
}

  return ['s-idle','대기'];
}

function stepIcon(k){ return I[k] || I.tool; }
function renderMsg(m){
  if (m.role === 'user'){
    const atts = (m.attachments||[]).length ? `<div class="atts">${m.attachments.map(a=>`<div class="att">${I.file}<span>${esc(a.name)}</span></div>`).join('')}</div>` : '';

  }
  if (m.role === 'manager') return `<div class="msg agent manager" id="m-${m.id}"><div class="who"><div class="av mgr-av">✦</div><span class="n">관리자</span><span class="tag" style="background:var(--raised);color:var(--text2)">Claude</span><span class="time">${fmtTime(m.ts)}</span></div><div class="body"><div class="mgrbox md">${md(m.text)}</div></div></div>`;

  const a = agent(m.agent);
  const running = m.status === 'running';
  const steps = m.steps || [];
  let stepsHtml = '';
  if (steps.length){
    const last = steps[steps.length-1];
    const curTxt = running ? esc(last.title) : `작업 ${steps.length}단계${steps.some(s=>s.status==='error')?' · 일부 실패':''}`;
    const openAttr = S.openSteps.has(m.id) ? 'open' : '';
    stepsHtml = `<details class="steps" data-id="${m.id}" ${openAttr}><summary>${running?'<span class="spin"></span>':`<span style="color:var(--ok)">${I.check}</span>`}<span class="cur">${curTxt}</span><span class="chev">${I.chev}</span></summary>
      <ol>${steps.map(s => `<li class="step ${s.status}"><span class="ic">${s.status==='running'?'<span class="spin" style="width:12px;height:12px"></span>':stepIcon(s.kind)}</span><div class="tx">${esc(s.title)}${s.output && S.openSteps.has(m.id)?`<pre>${esc(s.output)}</pre>`:''}</div></li>`).join('')}</ol></details>`;
  }
  let body = '';
  const hideMem = (t) => String(t||'').replace(/<기억>[\s\S]*?(<\/기억>|$)/g, '\n_🧠 방 기억 정리 중…_\n');
  const shown = hideMem(m.text || '') + (m.live ? (m.text ? '\n\n' : '') + hideMem(m.live) : '');
  if (m.status === 'error'){
    const clean = (m.text||'').replace(/\n*⚠️[\s\S]*$/,'').trim();
    body = (clean?`<div class="md" style="margin-bottom:8px">${md(clean)}</div>`:'') + `<div class="errbox"><div class="row"><span>⚠️ ${esc(m.errorHint || '실패했어요')}</span><span class="spacer"></span>${m.needsNoSandbox?`<button class="btn sm primary" data-allownosb="${m.id}">허용하고 다시 시도</button>`:''}<button class="btn sm" data-retry="${m.id}">${I.retry} 다시 시도</button></div>${m.errorDetail?`<details><summary>자세히</summary><pre>${esc(m.errorDetail)}</pre></details>`:''}</div>`;
  }
  else if (shown) body = `<div class="md">${md(shown)}</div>${running && m.live ? '<span class="caret"></span>' : ''}`;
  else if (running) body = (m.thinking?`<div class="thinking">${esc(m.thinking)}</div>`:'') + `<div class="typing"><i></i><i></i><i></i></div>`;
  let tail = '';
  if (m.status === 'stopped') tail = `<div class="st-stop">중지됨</div>`;
  if (m.memoryUpdate) tail += `<div><span class="memchip" data-memopen>🧠 방 기억을 정리했어요 +${m.memoryUpdate.added} −${m.memoryUpdate.removed} · 보기</span></div>`;
  if (m.unexpected) tail += `<div class="st-stop" style="color:var(--err)">⚠️ 읽기 전용이었는데 파일이 바뀌었어요. 확인하고 필요하면 되돌리세요.</div>`;
  if (m.changes && m.changes.length){
    const add = m.changes.reduce((s,f)=>s+f.add,0), del = m.changes.reduce((s,f)=>s+f.del,0);
    const rv = m.review==='approved' ? '<span class="review ok">승인됨</span>' : m.review==='rejected' ? '<span class="review no">반려됨</span>' : `<button class="btn sm primary" data-approve="${m.id}">승인</button><button class="btn sm" data-reject="${m.id}">반려</button>`;
    const html = m.changes.find(f => f.status!=='D' && /\.html?$/i.test(f.path));
    const rv2 = m.review==='approved' ? '<span class="review ok">승인됨</span>' : m.review==='rejected' ? '<span class="review no">반려됨</span>' : `<button class="btn sm ok" data-approve="${m.id}">승인</button><button class="btn sm" data-reject="${m.id}">반려</button>`;
    tail += `<div class="chsum"><span style="color:var(--text3)">${I.edit}</span>파일 ${m.changes.length}개 변경 <span class="add">+${add}</span><span class="del">−${del}</span></div>
      <div class="actbar">${html ? `<a class="btn sm primary" target="_blank" rel="noopener" href="${viewUrl(S.current, html.path)}">${esc(html.path.split('/').pop())} 열어보기</a>` : ''}<button class="btn sm" data-diff="${m.id}">변경 보기</button>${rv2}<button class="btn sm" data-revert="${m.id}">되돌리기</button></div>`;
  } else if (m.writer && m.status !== 'running' && m.checkpoint){

function mentionQuery(){

  const mm = before.match(/(^|\s)@([^\s@]*)$/); return mm ? { q:mm[2], start:pos-mm[2].length-1, end:pos } : null;

const ENGINE_ALIAS = { claude:['claude','클로'], codex:['codex','gpt','지피티'], opencode:['opencode','oc'] };
function aliasPairs(){
  const out = [];
  for (const a of S.agents){ out.push([a.id, a.name]); for (const x of ENGINE_ALIAS[a.id]||[]) out.push([a.id, x]); }
  for (const x of ['전체','all','모두']) out.push(['all', x]);
  return out.sort((x,y) => y[1].length - x[1].length);
}
function mentionsIn(text){
  const out = []; const re = /@([^\s@,.!?:;()\[\]"'`]+)/g; let m; const pairs = aliasPairs();
  while ((m = re.exec(text))){ const t = m[1].toLowerCase(); for (const [id, n] of pairs) if (t.startsWith(String(n).toLowerCase())) { if (!out.includes(id)) out.push(id); break; } }
  return out;
}
function updateTarget(){

  const text = $('#inp')?.value || ''; const ms = mentionsIn(text); const on = onAgents().map(a=>a.id);
  let who = ms.includes('all') ? on : ms.filter(x => on.includes(x));
  if (!ms.length){ const pick = [r.lastAgent, r.defaultAgent, ...on].find(x => x && on.includes(x)); who = pick ? [pick] : []; }
  document.querySelectorAll('.faces button').forEach(b => b.classList.toggle('on', ms.includes(b.dataset.id)));
  if (!who.length){ el.innerHTML = '<span style="color:var(--text3)">답할 AI가 없어요 · 멤버를 켜주세요</span>'; return; }
  const names = who.map(id => `<b style="color:${agent(id).color}">${esc(agent(id).name)}</b>`).join(', ');
  const w = who.length === 1 ? (r.writer === who[0] ? '작성 가능' : '읽기 전용') : '차례로 답해요';
  el.innerHTML = `<span>→ ${names}${who.length===1 ? (/[가-힣]$/.test(agent(who[0]).name) && ((agent(who[0]).name.charCodeAt(agent(who[0]).name.length-1)-0xac00)%28) ? '이' : '가') : '가'} 답해요</span> <span style="color:var(--text3)">· ${w}</span>`;
}

    const n = cb.querySelectorAll('button').length;
    if (e.key==='ArrowDown'){ e.preventDefault(); cSel=(cSel+1)%n; cmdPopup(); return; }
    if (e.key==='ArrowUp'){ e.preventDefault(); cSel=(cSel-1+n)%n; cmdPopup(); return; }
    if ((e.key==='Enter' || e.key==='Tab') && !e.isComposing){ e.preventDefault(); const b=cb.querySelectorAll('button')[cSel]; if (b) runCommand(b.dataset.c); return; }
    if (e.key==='Escape'){ cb.classList.remove('show'); return; }
  }
  if (e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){
    const v = $('#inp').value; const head = v.split(/\s/)[0];
    if (v.startsWith('/') && COMMANDS.some(x=>x.c===head)){ e.preventDefault(); runCommand(head, v.slice(head.length)); return; }
  }
  const box=$('#mentions');
  if (box.classList.contains('show')){
    const n = box.querySelectorAll('button').length;
    if (e.key==='ArrowDown'){ e.preventDefault(); mSel=(mSel+1)%n; mentionPopup(); return; }
    if (e.key==='ArrowUp'){ e.preventDefault(); mSel=(mSel-1+n)%n; mentionPopup(); return; }
    if (e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); const b=box.querySelectorAll('button')[mSel]; if (b) completeMention(b.dataset.k); return; }
    if (e.key==='Escape'){ box.classList.remove('show'); return; }
  }
  // Enter 전송, Shift+Enter 줄바꿈 (한글 조합 중 Enter는 무시)
  if (e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); sendMsg(); }
}

async function sendMsg(){
  const t=$('#inp'); const r=curRoom(); if (!t || !r) return;
  const text=t.value.trim(); if (!text && !S.pending.length) return;
  { const head = text.split(/\s/)[0]; if (text.startsWith('/') && COMMANDS.some(x=>x.c===head)){ runCommand(head, text.slice(head.length)); return; } }
  if (r.busy) return;
  askNotify();
  const atts = S.pending.map(u=>u.id);
  t.value=''; autosize(); store.set('ar_draft_'+r.id,''); S.pending=[]; renderPending();
  S.stick = true;
  const debate = S.debate; S.debate = null; if (debate) renderComposer();
  try { await api('/api/rooms/'+r.id+'/messages', { method:'POST', body:JSON.stringify({ text, attachments:atts, debate }) }); }
  catch(e){ toast(e.message); t.value=text; autosize(); }
}

async function uploadFile(f){
  const r=curRoom(); if (!r) return;
  if (f.size > 30*1024*1024){ toast('30MB 이하 파일만 올릴 수 있어요'); return; }
  S.uploading++; renderPending();
  try { const u = await api(`/api/rooms/${r.id}/upload?name=${encodeURIComponent(f.name)}`, { method:'POST', body:f, headers:{'Content-Type':'application/octet-stream'} }); S.pending.push(u); }
  catch(e){ toast('업로드 실패: '+e.message); }
  S.uploading--; renderPending();
}
document.addEventListener('paste', (e) => {
  if (!S.current) return;
  const files = [...(e.clipboardData?.files || [])];
  if (files.length){ e.preventDefault(); files.forEach(f => uploadFile(f.name && f.name!=='image.png' ? f : new File([f], `스크린샷-${Date.now()}.png`, {type:f.type}))); }
});

function upsertRoom(r){
  const { messages, ...sum } = r;
  const i = S.rooms.findIndex(x=>x.id===sum.id);
  if (i>=0) S.rooms[i] = { ...S.rooms[i], ...sum }; else S.rooms.unshift(sum);
  S.rooms.sort((a,b)=>b.updatedAt-a.updatedAt);
}

async function openDiff(msgId){
  const m = S.messages.find(x=>x.id===msgId); const r=curRoom(); if (!m || !r) return;
  const d = $('#drawer');
  d.innerHTML = `<header><h2>변경 내역</h2><button class="iconbtn" id="dClose">${I.x}</button></header><div class="patch" style="display:grid;place-items:center"><span class="spin"></span></div>`;
  d.classList.add('show'); $('#scrim').classList.add('show');
  $('#dClose').onclick = closeOverlays;
  try {
    const res = await api(`/api/rooms/${r.id}/changes?since=${m.checkpoint}`);
    const lines = res.patch.split('\n').map(l => {
      let c = '';
      if (l.startsWith('diff --git')) { c='f'; l = l.replace(/^diff --git a\/(.*) b\/.*$/, '$1'); }
      else if (/^(index |--- |\+\+\+ |new file|deleted file|similarity|rename )/.test(l)) return '';
      else if (l.startsWith('@@')) c='h';
      else if (l.startsWith('+')) c='a';
      else if (l.startsWith('-')) c='d';
      else if (l.startsWith('\\')) c='m';
      return `<div class="${c}">${esc(l)}</div>`;
    }).join('');
    d.innerHTML = `<header><h2>변경 내역</h2><button class="iconbtn" id="dClose">${I.x}</button></header>
      <div class="files">${res.files.length ? res.files.map(f=>`<div class="file"><span class="s s-${f.status}">${f.status}</span><span class="p">${esc(f.path)}</span><span class="add">+${f.add}</span><span class="del">−${f.del}</span></div>`).join('') : '<div style="padding:8px;color:var(--text3);font-size:13px">지금은 그 시점과 달라진 파일이 없어요</div>'}</div>
      <div class="patch">${lines || ''}</div>
      <footer><div class="note">이 작업 시작 전 상태 기준 · 이후 작업도 포함돼요</div><button class="btn" id="dRevert">되돌리기</button></footer>`;
    $('#dClose').onclick = closeOverlays;
    $('#dRevert').onclick = () => confirmRevert(msgId);
  } catch(e){ toast(e.message); }
}

      ${sets.length ? sets.slice().reverse().map(m => { const a=agent(m.agent); const add=m.changes.reduce((s,f)=>s+f.add,0), del=m.changes.reduce((s,f)=>s+f.del,0);
        return `<div class="ritem"><div class="t">${avatar(m.agent,22)}<b style="color:${a.color}">${esc(a.name)}</b><span style="color:var(--text3)">${fmtTime(m.ts)}</span><span class="add">+${add}</span><span class="del">−${del}</span>${m.review==='approved'?'<span class="review ok">승인됨</span>':m.review==='rejected'?'<span class="review no">반려됨</span>':''}<span class="spacer"></span><button class="linkbtn" data-diff="${m.id}">보기</button><button class="linkbtn muted" data-revert="${m.id}">되돌리기</button></div>
          <div class="fl">${m.changes.map(f=>`<span class="s s-${f.status}" style="display:inline-grid;width:16px;height:16px;font-size:10px;border-radius:4px;place-items:center;margin-right:4px">${f.status}</span>${esc(f.path)}`).join('<br>')}</div></div>`; }).join('') : '<div style="color:var(--text3);font-size:13px;padding:6px 2px">아직 작성 권한으로 한 작업이 없어요</div>'}
      ${ups.length ? `<div class="rsec">내가 올린 파일</div>${ups.map(u=>`<div class="fl">${I.file} ${esc(u.name)}</div>`).join('')}` : ''}
    </div>`;
}
function bindResults(d){
  const hide = () => { if (innerWidth <= 1100) $('#panel').classList.remove('open'); };
  d.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => { hide(); openDiff(b.dataset.diff); });
  d.querySelectorAll('[data-revert]').forEach(b => b.onclick = () => { hide(); confirmRevert(b.dataset.revert); });
  d.querySelectorAll('.thumbs img').forEach(img => img.onclick = () => { const lb=$('#lightbox'); lb.innerHTML=`<img src="${img.src}">`; lb.classList.add('show'); });
}

function viewUrl(roomId, p){ return `/view/${roomId}/${encodeURIComponent(TOKEN)}/${p.split('/').map(encodeURIComponent).join('/')}`; }

// ---------- 업데이트 ----------
async function checkUpdate(force){
  try { S.update = await api('/api/update'+(force?'?force=1':'')); } catch { return; }
  const b = $('#verBtn'); if (b) { b.outerHTML = `<button id="verBtn" style="font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:7px">v${esc(S.version||'')}${S.update.behind?'<span style="background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-weight:700">업데이트</span>':''}</button>`; $('#verBtn').onclick = openUpdate; }
}
async function openUpdate(){
  showModal(`<header><h2>업데이트</h2><button class="iconbtn" id="mClose">${I.x}</button></header><div class="mbody" style="display:grid;place-items:center;min-height:120px"><span class="spin"></span></div>`);
  $('#mClose').onclick = closeOverlays;
  await checkUpdate(true);
  const u = S.update || {};
  let body, ok = false;
  if (!u.git) body = `<p style="margin:0;color:var(--text2)">지금 설치는 git 연결이 안 돼 있어요. Termux에서 <code>install.sh</code>를 한 번 다시 돌리면 이 버튼으로 업데이트할 수 있어요.</p>`;
  else if (!u.fetchOk) body = `<p style="margin:0;color:var(--err)">업데이트 확인에 실패했어요.</p><pre style="font-size:12px;white-space:pre-wrap;color:var(--text3)">${esc(u.error||'')}</pre>`;
  else if (!u.behind) body = `<p style="margin:0;color:var(--text2)">최신 버전이에요 (v${esc(u.version)} · ${esc(u.current)}).</p>`;
  else { ok = true; body = `<p style="margin:0 0 8px;color:var(--text2)">새 변경 ${u.behind}개가 있어요. 받으면 서버가 잠깐 다시 켜져요. 대화방과 설정은 그대로예요.</p><ul style="margin:0;padding-left:18px;font-size:14px">${u.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`; }
  $('#modal').innerHTML = `<header><h2>업데이트</h2><button class="iconbtn" id="mClose">${I.x}</button></header><div class="mbody">${body}</div>
    <footer><button class="btn" id="mRestart" style="margin-right:auto">서버 재시작</button><button class="btn" id="mCancel">닫기</button>${ok?'<button class="btn primary" id="mOk">지금 업데이트</button>':''}</footer>`;
  $('#mClose').onclick = $('#mCancel').onclick = closeOverlays;
  $('#mRestart').onclick = () => restartServer();
  if (ok) $('#mOk').onclick = async () => {
    $('#mOk').disabled = true; $('#mOk').textContent = '받는 중…';
    try { await api('/api/update', { method:'POST' }); waitRestart(); }
    catch(e){ toast(e.message); $('#mOk').disabled = false; $('#mOk').textContent = '지금 업데이트'; }
  };
}
async function restartServer(force){
  try { await api('/api/restart', { method:'POST', body:JSON.stringify({ force:!!force }) }); waitRestart(); }
  catch(e){
    if (/작업 중/.test(e.message)){
      showModal(`<header><h2>재시작할까요?</h2></header><div class="mbody"><p style="margin:0;color:var(--text2)">${esc(e.message)}</p></div><footer><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mOk">멈추고 재시작</button></footer>`);
      $('#mCancel').onclick = closeOverlays; $('#mOk').onclick = () => restartServer(true);
    } else toast(e.message);
  }
}
function waitRestart(){
  showModal(`<div class="mbody" style="text-align:center;padding:28px"><span class="spin" style="display:inline-block;width:22px;height:22px"></span><p style="margin:12px 0 0">업데이트 적용 중… 잠시만요</p></div>`);
  const t0 = Date.now();
  setTimeout(async function poll(){
    try { await api('/api/state'); location.reload(); return; } catch {}
    if (Date.now() - t0 < 60000) setTimeout(poll, 1500); else { closeOverlays(); toast('서버가 다시 안 켜졌어요. Termux에서 ~/start.sh'); }
  }, 2500);
}

// ---------- 알림 ----------
function askNotify(){ try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch{} }
async function showNotify(title, body){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, { body, tag:'agent-room', icon:'/icon-192.png' });
    else new Notification(title, { body });
  } catch{}
}

// ---------- 테마 ----------
function applyTheme(){ const t=store.get('ar_theme'); if (t) document.documentElement.dataset.theme=t; }
function toggleTheme(){
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; document.documentElement.dataset.theme=t; store.set('ar_theme',t);
}

// ---------- 실시간 ----------
let es;
function connect(){
  if (es) es.close();
  es = new EventSource('/api/events?token='+encodeURIComponent(TOKEN));
  es.onopen = () => { $('#conn').classList.remove('show'); if (connect.lost){ connect.lost=false; refresh(); } };
  es.onerror = () => { $('#conn').classList.add('show'); connect.lost = true; };
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'message'){
      const r = S.rooms.find(x=>x.id===ev.roomId);
      if (r && ev.message.role !== 'system') r.preview = (ev.message.text||'').replace(/\s+/g,' ').slice(0,80);
      if (ev.roomId === S.current){
        const i = S.messages.findIndex(m=>m.id===ev.message.id);
        const first = !S.messages.length;
        if (i>=0) S.messages[i] = ev.message; else S.messages.push(ev.message);
        if (first) { renderThread(); scrollBottom(true); } else updateMsg(ev.message);
        if (ev.message.status !== 'running' && S.panelTab === 'results') renderPanel();
      }
    } else if (ev.type === 'room'){
      const sig = (r) => r ? Object.entries(r.agents||{}).filter(([,v])=>v.enabled).map(([k])=>k).join() : '';
      const before = sig(S.rooms.find(x=>x.id===ev.room.id));
      upsertRoom(ev.room); renderSide();
      if (ev.room.id === S.current){ renderTop(); renderMemo(); if (before !== sig(ev.room)) renderComposer(); else { updateBusy(); updateTarget(); } renderPanel(); }
    } else if (ev.type === 'personas'){
      reloadAgents().catch(()=>{});
    } else if (ev.type === 'briefing'){
      S.briefNew = true; const dot = $('#briefDot'); if (dot) dot.className = 'dot';
      if (document.hidden) showNotify(ev.briefing.kind==='weekly'?'주간 회고':'아침 브리핑', ev.briefing.text.split('\n')[0]);
    } else if (ev.type === 'usage'){
      S.usage = ev.usage; renderPanel();
    } else if (ev.type === 'restarting'){
      if (!$('#modal').classList.contains('show')) waitRestart();
    } else if (ev.type === 'idle'){
      if (document.hidden) showNotify(ev.title, ev.body);
    } else if (ev.type === 'roomDeleted'){
      S.rooms = S.rooms.filter(r=>r.id!==ev.roomId);
      if (S.current === ev.roomId){ S.current=null; S.messages=[]; renderTop(); renderThread(); renderComposer(); }
      renderSide();
    }
  };
}
async function refresh(){
  const st = await api('/api/state'); S.agents = st.agents; S.rooms = st.rooms; S.home = st.home;
  renderSide();
  if (S.current && S.rooms.some(r=>r.id===S.current)) openRoom(S.current);
}

function renderLogin(){
  $('#app').innerHTML = `<div class="login"><div class="brand" style="justify-content:center"><div class="mark">${I.mark}</div></div>
    <h1>접속 주소가 필요해요</h1><p>Termux에서 서버를 켜면 나오는 주소(<code>#</code> 뒤 토큰 포함)로 열어주세요.</p>
    <p style="font-size:13px">주소는 <code>~/.agent-room/url.txt</code>에도 있어요.</p></div>`;
}

async function init(){
  applyTheme();
  S.openSteps = new Set();
  if (!TOKEN){ renderLogin(); return; }
  try { const st = await api('/api/state'); S.agents=st.agents; S.rooms=st.rooms; S.home=st.home; S.version=st.version; S.teams=st.teams||[]; }
  catch(e){ if (e.message!=='auth'){ $('#app').innerHTML = `<div class="login"><h1>서버에 연결할 수 없어요</h1><p>${esc(e.message)}</p></div>`; } return; }
  renderShell(); connect();
  refreshHealth();
  api('/api/usage').then(u => { S.usage = u; renderPanel(); }).catch(()=>{});
  api('/api/models').then(m => { S.models = m; renderPanel(); }).catch(()=>{});
  setInterval(() => renderPanel(), 60000); // 초기화까지 남은 시간 갱신
  checkUpdate(); setInterval(() => checkUpdate(), 30*60000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const last = store.get('ar_room');
  if (last && S.rooms.some(r=>r.id===last)) openRoom(last);
  else if (S.rooms[0] && innerWidth > 900) openRoom(S.rooms[0].id);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && es && es.readyState===2) connect(); });
init();
</script>
